# -----------------------------------------------------------------------------
# RAG measurement gold set  (TEMPLATE -- entries below are SYNTHETIC examples)
# -----------------------------------------------------------------------------
# Scope: MEASUREMENTS ONLY (the measurement_chunks table). Documents and chatbot
# tools are out of scope for this eval.
#
# Copy this file to `gold_set.yaml` and replace it with real cases.
#
# IMPORTANT: a real gold set references real patient records (PHI). Keep
# `gold_set.yaml` OUT of git and build/store it only inside the clinic's
# controlled environment. This example file contains no real data.
#
# Fields per case:
#   id                        : short unique label
#   query                     : the primary natural-language question
#   phrasings                 : alternative wordings of the SAME question, incl.
#                               terse ones. The auto-eval runs query + every
#                               phrasing separately, so phrasing-sensitivity
#                               (one wording works, another fails) is measured.
#   patient_id                : demographic_no to scope the search (string/int)
#   date                      : optional 'YYYY-MM-DD' date filter (or null)
#   relevant_measurement_ids  : measurement_ids that SHOULD be retrieved, matching
#                               the DB's stored grouped-id string exactly. Leave
#                               [""] and fill after running
#                               dump_patient_measurements.py to see the real ids.
#   target_types              : measurement types this question should hit. Used
#                               by the rule-based auto-eval to derive the expected
#                               answer from the DB WITHOUT hand-labeling.
#   auto_rule                 : "latest" -> newest row of target_types;
#                               "all"    -> every row of target_types (trends)
#   notes                     : free text, for humans only
#
# Two ways to use this:
#   * MANUAL -- fill patient_id + relevant_measurement_ids, run run_eval.py.
#   * AUTO   -- fill only patient_id (or let auto_eval pick patients); the
#              auto-eval derives expected ids from the DB, no hand-labeling.
# -----------------------------------------------------------------------------

# --- Investigations -----------------------------------------------------------
- id: echo_latest_ef
  query: "What was the ejection fraction on the most recent echocardiogram?"
  phrasings:
    - "most recent EF"
    - "latest ejection fraction"
    - "EF on last echo"
  patient_id: ""
  date: null
  relevant_measurement_ids: [""]
  target_types: ["ECHO", "SECHO"]
  auto_rule: "latest"
  expected_tool: ["get_measurements"]
  notes: "Newest echo measurement group for the patient."

- id: echo_ef_trend
  query: "Show me the ejection fraction over time."
  phrasings:
    - "what is the trend of EF"
    - "EF trend"
    - "trend ef"
    - "how has the EF changed over time"
  patient_id: ""
  date: null
  relevant_measurement_ids: [""]
  target_types: ["ECHO", "SECHO"]
  auto_rule: "all"
  expected_tool: ["get_measurements", "get_measurement_history"]
  notes: "Trend question -- all echo groups should be retrievable. Includes terse phrasings that tend to fail."

